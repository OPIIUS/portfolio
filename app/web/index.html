<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>OPIIUS</title>
<style>
:root{
  --bg:#07070a; --s1:#101015; --s2:#16161d; --s3:#1d1d26; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#f5f5f7; --dim:#a0a0ac; --dim2:#6f6f7b;
  --brand:#b794ff; --accent:#b794ff; --accentInk:#120a24; --accentSoft:rgba(183,148,255,.14);
  --good:#34d399; --goodSoft:rgba(52,211,153,.13); --warn:#fbbf24; --warnSoft:rgba(251,191,36,.13);
  --bad:#f87171; --badSoft:rgba(248,113,113,.13); --info:#7cb4ff; --infoSoft:rgba(124,180,255,.13);
  --r:18px; --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body.rent{--accent:#ffa94d;--accentInk:#231200;--accentSoft:rgba(255,169,77,.14)}
body.tour{--accent:#2dd4bf;--accentInk:#00201c;--accentSoft:rgba(45,212,191,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Roboto,"SF Pro Text",-apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  font-size:15px;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.screen.hide{opacity:0;transform:scale(.97);pointer-events:none}

/* splash */
#splash{align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
.glow.a{background:#6d3df5;top:-180px;left:-160px;animation:drift 12s ease-in-out infinite alternate}
.glow.b{background:#1f9e8f;bottom:-220px;right:-180px;opacity:.35;animation:drift 14s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,40px) scale(1.1)}}
.wordmark{font-size:54px;font-weight:800;letter-spacing:.18em;margin-right:-.18em;position:relative;
  background:linear-gradient(170deg,#fff 30%,#c9a8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise 1s var(--ease) both}
.tagline{color:var(--dim);font-size:15px;line-height:1.6;margin-top:14px;max-width:300px;position:relative;animation:rise 1s .15s var(--ease) both}
.enter{margin-top:44px;position:relative;animation:rise 1s .3s var(--ease) both}
.madein{position:absolute;bottom:calc(26px + var(--bot));color:var(--dim2);font-size:12px;letter-spacing:.08em;animation:rise 1s .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 30px;border-radius:27px;
  background:#fff;color:#0b0b10;font-weight:700;font-size:16px;transition:transform .15s var(--ease)}
.cta:active,.press:active{transform:scale(.96)}

/* picker */
#pick{padding:calc(28px + var(--top)) 20px calc(24px + var(--bot));overflow-y:auto}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--dim2);font-weight:700;text-transform:uppercase}
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 6px;line-height:1.15}
.sub{color:var(--dim);font-size:14.5px;line-height:1.55}
.sys{position:relative;display:block;width:100%;text-align:left;margin-top:16px;border-radius:26px;padding:22px 20px 20px;
  overflow:hidden;border:1px solid var(--line2);transition:transform .2s var(--ease);animation:rise .8s var(--ease) both}
.sys:active{transform:scale(.98)}
.sys.r{background:radial-gradient(120% 90% at 100% 0%,rgba(255,169,77,.28),transparent 60%),var(--s1)}
.sys.t{background:radial-gradient(120% 90% at 100% 0%,rgba(45,212,191,.26),transparent 60%),var(--s1);animation-delay:.1s}
.sys .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.sys.r .ic{background:rgba(255,169,77,.16)} .sys.t .ic{background:rgba(45,212,191,.16)}
.sys h2{margin:16px 0 4px;font-size:22px;letter-spacing:-.01em}
.sys p{margin:0;color:var(--dim);font-size:14px;line-height:1.55}
.sys .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sys .tags span{font-size:11.5px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#d6d6de}
.sys .go{position:absolute;top:22px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}

/* ---------- app shell ---------- */
#app .bar{padding:calc(12px + var(--top)) 18px 10px;display:flex;align-items:center;gap:12px;flex:none;
  background:linear-gradient(var(--bg) 70%,rgba(7,7,10,0))}
.logo{width:40px;height:40px;border-radius:13px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px}
.bar .t b{display:block;font-size:17px;letter-spacing:-.01em}
.bar .t span{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--s2);display:grid;place-items:center;border:1px solid var(--line);position:relative}
.iconbtn .pip{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--s2)}
.ml{margin-left:auto}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(96px + var(--bot));-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#main::-webkit-scrollbar{display:none}
.page{animation:pageIn .38s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--bot));height:66px;border-radius:24px;display:flex;
  background:rgba(22,22,29,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);
  box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim2);font-size:10.5px;font-weight:600;position:relative}
.nav button svg{width:23px;height:23px;transition:transform .25s var(--ease)}
.nav button.on{color:var(--accent)}
.nav button.on svg{transform:translateY(-1px) scale(1.06)}
.nav .badge{position:absolute;top:9px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* ---------- building blocks ---------- */
.hello{margin:6px 2px 16px}
.hello .d{color:var(--dim);font-size:13px}
.hello h1{margin:3px 0 0;font-size:26px;letter-spacing:-.02em}
.hello.act{display:flex;align-items:flex-end;gap:12px}
.hello.act .btn{margin-left:auto;flex:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec h3{margin:0;font-size:16px;letter-spacing:-.01em}
.sec a{color:var(--accent);font-size:13px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px}
.kpi i{font-style:normal;color:var(--dim);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.02em}
.kpi small{display:block;color:var(--good);font-size:11.5px;margin-top:3px}
.kpi.hero{grid-column:1/-1;background:radial-gradient(120% 140% at 100% 0%,var(--accentSoft),transparent 60%),var(--s1)}
.kpi.hero b{font-size:32px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);position:relative;transition:background .15s}
.row:last-child{border-bottom:0}
.row.tap:active{background:var(--s2)}
.av{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--s3);color:#e6e6ee}
.av.acc{background:var(--accentSoft);color:var(--accent)}
.av.good{background:var(--goodSoft);color:var(--good)} .av.warn{background:var(--warnSoft);color:var(--warn)}
.av.bad{background:var(--badSoft);color:var(--bad)} .av.info{background:var(--infoSoft);color:var(--info)}
.grow{flex:1;min-width:0}
.grow b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow span{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{text-align:right;flex:none}
.end b{display:block;font-size:14px}
.end span{display:block;color:var(--dim2);font-size:11.5px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap}
.chip.good{background:var(--goodSoft);color:var(--good)} .chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.bad{background:var(--badSoft);color:var(--bad)} .chip.info{background:var(--infoSoft);color:var(--info)}
.chip.acc{background:var(--accentSoft);color:var(--accent)} .chip.n{background:rgba(255,255,255,.07);color:var(--dim)}
.btn{height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:var(--accentInk)}
.btn.sec2{background:var(--s3);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:34px;padding:0 13px;border-radius:11px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.35}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--badSoft);border:1px solid rgba(248,113,113,.22);margin-bottom:10px}
.alert.warn{background:var(--warnSoft);border-color:rgba(251,191,36,.22)}
.alert .grow b{white-space:normal} .alert .grow span{white-space:normal;line-height:1.45}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13px;font-weight:600;color:var(--dim);transition:background .2s,color .2s}
.seg button.on{background:var(--s3);color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim)}
.filters button.on{background:var(--accentSoft);border-color:transparent;color:var(--accent)}
.empty{padding:34px 20px;text-align:center;color:var(--dim);font-size:14px}
.fab{position:fixed;right:20px;bottom:calc(92px + var(--bot));height:54px;padding:0 20px 0 16px;border-radius:27px;background:var(--accent);color:var(--accentInk);
  font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:15;transition:transform .15s var(--ease)}
.fab:active{transform:scale(.95)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:16px 14px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 40%,transparent));
  transform-origin:bottom;animation:grow .7s var(--ease) both}
.bars i.dim{background:var(--s3)}
.bars span{font-size:11px;color:var(--dim2)}
@keyframes grow{from{transform:scaleY(0)}}
.meter{height:6px;border-radius:6px;background:var(--s3);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:6px;background:var(--accent)}

/* photos: a real photo loads over a tinted placeholder; offline, the placeholder stays */
.ph{position:relative;overflow:hidden;background:radial-gradient(120% 120% at 100% 0%,var(--accentSoft),transparent 60%),var(--s3);
  display:grid;place-items:center;flex:none}
.ph>span{font-size:28px;opacity:.9}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease)}
.ph img.ok{opacity:1}
.ph.thumb{width:48px;height:48px;border-radius:14px}
.ph.thumb>span{font-size:20px}
.ph.tile{width:100%;aspect-ratio:4/3;border-radius:14px;margin-bottom:10px}
.ph.hero{width:100%;height:190px;border-radius:20px;margin:4px 0 14px}
.ph.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.ph.hero .cap{position:absolute;left:14px;bottom:12px;z-index:1;font-weight:700;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.sys .bg{position:absolute;inset:0;opacity:.34;background-size:cover;background-position:center}
.sys .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,16,21,.2),var(--s1) 85%)}
.sys>*:not(.bg){position:relative}
.sys .go{position:absolute}
.vopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vopt{background:var(--s2);border:1px solid var(--line2);border-radius:16px;padding:8px;text-align:left;transition:all .15s}
.vopt .ph.tile{margin-bottom:8px;border-radius:11px}
.vopt b{display:block;font-size:13.5px;padding:0 4px} .vopt small{display:block;color:var(--dim);font-size:11.5px;padding:2px 4px 2px}
.vopt.on{border-color:var(--accent);background:var(--accentSoft)} .vopt.on b{color:var(--accent)}
.vopt:disabled{opacity:.35}
.credits{font-size:12px;color:var(--dim2);line-height:1.6;padding:14px;word-break:break-word}

/* grid of bikes */
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;transition:transform .15s var(--ease)}
.unit:active{transform:scale(.97)}
.unit .em{font-size:24px}
.unit{padding:8px 8px 12px}
.unit b,.unit .plate,.unit .chip{margin-left:6px}
.unit b{display:block;font-size:13.5px;margin-top:2px}
.unit .plate{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12px;color:var(--dim);margin-top:2px;letter-spacing:.02em}
.unit .chip{margin-top:10px}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--s1);border-radius:26px 26px 0 0;z-index:41;
  transform:translateY(105%);transition:transform .42s var(--ease);display:flex;flex-direction:column;border-top:1px solid var(--line2)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:10px auto 0;flex:none}
.sheet .sh{padding:14px 20px 6px;display:flex;align-items:center;gap:12px;flex:none}
.sheet .sh h2{margin:0;font-size:20px;letter-spacing:-.01em}
.sheet .sh p{margin:2px 0 0;color:var(--dim);font-size:13px}
#sheetIn{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.sheet .sb{overflow-y:auto;min-height:0;flex:1 1 auto;padding:8px 20px calc(22px + var(--bot));overscroll-behavior:contain}
.close{width:34px;height:34px;border-radius:50%;background:var(--s3);display:grid;place-items:center;margin-left:auto;flex:none}
.lbl{font-size:12px;color:var(--dim);font-weight:600;margin:16px 2px 8px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px;background:var(--s2);border-radius:16px;padding:14px}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:right;font-weight:600}
.field{width:100%;height:50px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);color:var(--ink);padding:0 14px;font-size:15px;outline:0;font-family:inherit}
.field:focus{border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-height:40px;padding:8px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:#d8d8e0;text-align:left;transition:all .15s}
.opts button small{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:1px}
.opts button.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.opts button:disabled{opacity:.35}
.opts.grid5 button{flex:1;min-width:0;text-align:center;padding:8px 0}
.checks button{display:flex;width:100%;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--s2);margin-bottom:8px;font-size:14px;font-weight:500;text-align:left}
.checks .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;transition:all .2s;flex:none}
.checks button.on .box{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.stepper{display:flex;align-items:center;gap:0;background:var(--s2);border:1px solid var(--line2);border-radius:14px;height:50px;width:max-content}
.stepper button{width:50px;height:48px;font-size:22px;color:var(--accent)}
.stepper b{min-width:64px;text-align:center;font-size:15px}
.bill{background:var(--s2);border-radius:16px;overflow:hidden;margin-top:6px}
.bill div{display:flex;justify-content:space-between;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.bill div:last-child{border-bottom:0}
.bill .m{color:var(--bad)}
.bill .tot{background:var(--accentSoft);color:var(--accent);font-weight:800;font-size:15.5px}
.bill .tot.good{background:var(--goodSoft);color:var(--good)}
.bill .tot.bad{background:var(--badSoft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl{position:relative;padding:0 0 16px}
.tl:before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--s3);border:2px solid var(--line2)}
.tl.done:before{background:var(--accent);border-color:var(--accent)}
.tl.now:before{background:var(--bg);border-color:var(--accent);box-shadow:0 0 0 4px var(--accentSoft)}
.tl b{font-size:14px;display:block} .tl span{color:var(--dim);font-size:12.5px;display:block;margin-top:2px;line-height:1.45}

/* chat */
.thread{display:flex;flex-direction:column;gap:8px;padding:6px 0 10px}
.bub{max-width:84%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;animation:rise .3s var(--ease) both}
.bub.in{align-self:flex-start;background:var(--s3);border-top-left-radius:5px}
.bub.out{align-self:flex-end;background:#2b2a2a;background:color-mix(in srgb,var(--accent) 22%,var(--s2));border-top-right-radius:5px}
.bub.bot{align-self:flex-end;background:#1c2b27;border-top-right-radius:5px}
.bub small{display:block;font-size:10.5px;color:var(--dim2);margin-top:4px;text-align:right}
.bub.note{align-self:center;background:transparent;color:var(--dim2);font-size:12px;padding:2px}
.typing{align-self:flex-end;background:#1c2b27;border-radius:16px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#7fb8a8;animation:bnc 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.reply{display:flex;gap:8px;margin-top:8px}
.reply .field{height:46px;border-radius:23px}
.send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accentInk);flex:none;display:grid;place-items:center}

var RS='₹';
function money(n){return (n<0?'-':'')+RS+Math.abs(Math.round(n||0)).toLocaleString('en-IN');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function d2(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate());}
function dt(s){return new Date(s+'T00:00:00');}
function today(){return iso(new Date());}
function addD(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d);}
function diffD(a,b){return Math.round((dt(b)-dt(a))/864e5);}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(s){var d=dt(s);return DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function relLow(s){var n=diffD(today(),s);return n===0?'today':n===1?'tomorrow':'on '+fmt(s);}
function rel(s){var n=diffD(today(),s);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':fmt(s);}
function nextDow(dow){var d=new Date();while(d.getDay()!==dow)d.setDate(d.getDate()+1);return iso(d);}
function initials(n){return n.split(/\s+|(?=[A-Z][a-z])/).filter(Boolean).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}

function load(){try{ST=JSON.parse(localStorage.getItem('opiius_demo')||'null');}catch(e){}

function endOf(b){return addD(b.start,b.days-1);}
function unit(reg){return R().units.filter(function(u){return u.reg===reg;})[0];}
function bk(id){return R().bk.filter(function(b){return b.id===id;})[0];}
function overdue(b){return b.status==='active'&&endOf(b)<today();}
function dueToday(b){return b.status==='active'&&endOf(b)===today();}
function unitState(u){
  if(u.svc)return ['bad','Service'];
  var t=today();
  var a=R().bk.filter(function(b){return b.reg===u.reg&&b.status==='active';})[0];
  if(a)return overdue(a)?['bad','Overdue']:['warn','On ride'];
  var up=R().bk.filter(function(b){return b.reg===u.reg&&b.status==='upcoming'&&b.start===t;})[0];
  if(up)return ['info','Pickup today'];
  return ['good','Free'];
}
function freeUnits(type,start,days){
  var end=addD(start,days);
  return R().units.filter(function(u){
    if(u.type!==type||u.svc)return false;
    return !R().bk.some(function(b){return b.reg===u.reg&&(b.status==='active'||b.status==='upcoming')&&b.start<end&&start<addD(b.start,b.days);});
  });
}

/* =================================================================== */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||el.disabled)return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id'), v=el.getAttribute('data-v');
  var A={
    enter:function(){showScreen('pick');},
    open:function(){openSys(el.getAttribute('data-sys'));},
    'switch':function(){closeSheet();showScreen('pick');},
    tab:function(){TAB=el.getAttribute('data-tab');renderTab();},
    sub:function(){SUBTAB[el.getAttribute('data-k')]=v;renderTab(true);},
    filter:function(){FILTER[el.getAttribute('data-k')]=v;renderTab(true);},
    closeSheet:closeSheet,
    call:function(){toast('Calling '+el.getAttribute('data-who')+'…','In the live app this opens your phone dialler','info');},
    /* rentals */
    openBk:function(){openSheet(function(){return bkSheet(id);});},
    openUnit:function(){openSheet(function(){return unitSheet(el.getAttribute('data-reg'));});},
    handover:function(){var b=bk(id);FORM={id:id,c:{},odo:unit(b.reg).odo,fuel:5};openSheet(handoverSheet);},
    chk:function(){var i=el.getAttribute('data-i');FORM.c[i]=!FORM.c[i];drawSheet();},
    set:function(){var f=el.getAttribute('data-f');FORM[f]=(f==='fuel'||f==='dmg'||f==='amt')?+v:v;keepInputs();drawSheet();},
    doHandover:function(){keepInputs();var b=bk(FORM.id),u=unit(b.reg);
      b.status='active';b.out={odo:+FORM.odo||u.odo,fuel:FORM.fuel};u.odo=b.out.odo;closeSheet();refresh();
      toast('Ride started','WhatsApp sent to '+b.name+' with return time and roadside help');},
    'return':function(){var b=bk(id);FORM={id:id,odo:b.out.odo+Math.round(BIKES[b.type].km*b.days*.85),fuel:4,late:'0',dmg:0};openSheet(returnSheet);},
    doReturn:function(){keepInputs();var b=bk(FORM.id),s=settle(),u=unit(b.reg);
      b.status='done';b.settle={refund:s.refund,ded:s.ded};u.odo=+FORM.odo;if(s.dmg)u.svc='Damage repair after '+b.id;closeSheet();refresh();
      toast(s.refund>=0?'Refund of '+money(s.refund)+' sent':'Collect '+money(-s.refund)+' from rider',b.name+' · receipt sent on WhatsApp');},
    svc:function(){unit(el.getAttribute('data-reg')).svc='General service · in workshop';drawSheet();refresh();toast('Sent to service','It won’t be offered to riders until it’s back','info');},
    svcDone:function(){unit(el.getAttribute('data-reg')).svc=null;drawSheet();refresh();toast('Back in the fleet','Available for bookings again');},
    newRent:function(){FORM={start:today(),days:1,type:null};openSheet(newRentSheet);},
    days:function(){keepInputs();FORM.days=Math.max(1,Math.min(14,FORM.days+(+v)));drawSheet();},
    doNewRent:function(){keepInputs();if(!FORM.name){toast('Add the rider’s name','','bad');return;}
      var u=freeUnits(FORM.type,FORM.start,FORM.days)[0],rent=rentFor(FORM.type,FORM.start,FORM.days);ST.rent.seq++;
      var b={id:'WR-'+ST.rent.seq,name:FORM.name,phone:FORM.phone||'—',reg:u.reg,type:FORM.type,start:FORM.start,days:FORM.days,rent:rent,adv:Math.round(rent*.3),
        dep:BIKES[FORM.type].dep,status:'upcoming',trip:'City',src:'Walk-in',today:true};
      R().bk.push(b);closeSheet();refresh();toast('Booking '+b.id+' created',b.reg+' blocked for '+fmt(b.start)+' · confirmation sent');},
    openChat:function(){openChat(+id);},
    useSuggest:function(){var x=R().inbox.filter(function(i){return i.id===+id;})[0];$('fReply').value=x.suggest;},
    sendReply:function(){var x=R().inbox.filter(function(i){return i.id===+id;})[0],t=$('fReply').value.trim();if(!t)return;
      x.msgs.push(['out',t]);x.status='faq';x.time='Now';drawSheet();scrollSheet();refresh();toast('Reply sent','The assistant takes the chat from here');},
    simulate:simulate,
    /* tours */
    openTrip:function(){openSheet(function(){return tripSheet(id);});},
    doc:function(){var x=trip(id),i=+el.getAttribute('data-i'),k=+el.getAttribute('data-k');x.people[i][k]=x.people[i][k]?0:1;drawSheet();refresh();},
    assign:function(){trip(id).driver='Dipankar Nath';drawSheet();refresh();toast('Driver assigned','Dipankar Nath · details sent to the group');},
    sendItin:function(){var x=trip(id);toast('Itinerary sent to '+x.pax+' traveller'+(x.pax>1?'s':''),'Day-by-day plan, driver number and hotel list on WhatsApp');},
    openLead:function(){openSheet(function(){return leadSheet(id);});},
    q:function(){var L=lead(id);L.q[el.getAttribute('data-f')]=v;drawSheet();},
    qpax:function(){var L=lead(id);L.q.pax=Math.max(1,Math.min(40,L.q.pax+(+v)));drawSheet();},
    sendQuote:function(){var L=lead(id);L.quote=quoteFor(L).total;L.stage='quoted';closeSheet();refresh();toast('Quote sent to '+L.name,money(L.quote)+' · follow-up reminder set for 2 days');},
    won:function(){var L=lead(id),q=quoteFor(L);L.stage='won';L.quote=q.total;T().seq++;
      var ppl=[];for(var i=0;i<L.q.pax;i++)ppl.push([i?L.name.split(' ')[0]+' +'+i:L.name,0,0]);
      T().trips.push({id:'NT-'+T().seq,pkg:L.q.pkg,kind:'Private',start:addD(today(),21),lead:L.name,pax:L.q.pax,seats:L.q.pax,driver:'Unassigned',veh:'To assign',people:ppl,total:q.total,paid:Math.round(q.total*.3)});
      T().week[6]+=q.total;closeSheet();refresh();toast('Won! Trip NT-'+T().seq+' created','30% advance recorded · documents requested from travellers');},
    lost:function(){lead(id).stage='lost';closeSheet();refresh();toast('Marked as lost','We’ll ask them why in a week','info');},
    newLead:function(){T().leads.unshift({id:Date.now(),name:'Walk-in enquiry',from:'Guwahati',pax:2,when:'Next month',want:'kaz',budget:'Open',stage:'new',src:'Phone',note:'Added by you. The AI will fill in details from the chat.'});
      SUBTAB.leads='new';refresh();toast('Enquiry added','Open it to build a quote','info');},
    payTrip:function(){var x=trip(id);FORM={amt:x.total-x.paid,how:'UPI link'};openSheet(function(){return paySheet(id);});},
    remind:function(){var x=trip(id);closeSheet();toast('Reminder sent to '+x.lead,'Polite WhatsApp nudge with a UPI link');},
    doPay:function(){var x=trip(id);if(FORM.how==='UPI link'){closeSheet();toast('UPI link sent',money(FORM.amt)+' requested from '+x.lead);return;}
      x.paid=Math.min(x.total,x.paid+FORM.amt);closeSheet();refresh();toast(money(FORM.amt)+' recorded',x.lead+' · receipt sent on WhatsApp');},
    /* settings */
    saveBiz:function(){var n=$('fBiz').value.trim(),o=$('fOwner').value.trim();if(n)ST.names[SYS]=n;if(o)ST.owner=o;save();
      $('bizName').textContent=ST.names[SYS];$('logo').textContent=initials(ST.names[SYS]);refresh();toast('Saved','The app now shows '+ST.names[SYS]);},
    resetDemo:function(){var n=ST.names,o=ST.owner;ST=fresh();ST.names=n;ST.owner=o;save();renderTab();toast('Demo data reset','Everything is back to the start');}
  };
  if(sheetFn&&a!=='closeSheet')keepInputs();
  if(A[a])A[a]();
});
/* keep typed values when a sheet redraws */
function keepInputs(){['fOdo','fName','fPhone'].forEach(function(k){var el=$(k);if(el){var f={fOdo:'odo',fName:'name',fPhone:'phone'}[k];FORM[f]=el.value;}});}
document.addEventListener('input',function(e){if(e.target.id==='fOdo'&&FORM.id&&bk(FORM.id)&&bk(FORM.id).status==='active'){FORM.odo=e.target.value;
  var pos=e.target.selectionStart;drawSheet();var n=$('fOdo');n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}});

[].forEach.call(document.querySelectorAll('[data-photo]'),function(el){el.style.backgroundImage='url("'+photoUrl(el.getAttribute('data-photo'),900)+'")';});
/* open straight into a system for testing: #rent or #tour */
if(/^#(rent|tour)$/.test(location.hash))openSys(location.hash.slice(1));
</script>
</body>
</html>
