# Temporary: downloads Wikimedia Commons photos for demos/bs-car-rental.html.
# Deleted once the photos are committed.
name: fetch-car-photos
on:
  push:
    branches: [claude/dazzling-euler-n1l0zt]
    paths: [.github/workflows/fetch-car-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Wikipedia lead photos
        run: |
          UA="opiius-portfolio-demo/1.0 (https://github.com/OPIIUS/portfolio)"
          OUT=demos/assets/cars
          mkdir -p $OUT
          echo "[" > $OUT/credits.json
          first=1
          while IFS='|' read -r id titles; do
            [ -z "$id" ] && continue
            IFS=';' read -ra cands <<< "$titles"
            for title in "${cands[@]}"; do
              q=$(curl -sG -A "$UA" "https://en.wikipedia.org/w/api.php" \
                --data-urlencode action=query --data-urlencode prop=pageimages \
                --data-urlencode "piprop=thumbnail|name" --data-urlencode pithumbsize=960 \
                --data-urlencode redirects=1 --data-urlencode format=json --data-urlencode "titles=$title")
              src=$(echo "$q" | jq -r '[.query.pages[]?.thumbnail.source // empty][0] // empty')
              file=$(echo "$q" | jq -r '[.query.pages[]?.pageimage // empty][0] // empty')
              [ -n "$src" ] && break
            done
            echo "$id: $title -> ${file:-NONE}"
            [ -z "$src" ] && continue
            ext="${src##*.}"; ext="${ext,,}"
            curl -sL -A "$UA" -o "$OUT/$id.$ext" "$src"
            meta=$(curl -sG -A "$UA" "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode action=query --data-urlencode prop=imageinfo \
              --data-urlencode "iiprop=extmetadata|url" --data-urlencode format=json \
              --data-urlencode "titles=File:$file")
            entry=$(echo "$meta" | jq -c --arg id "$id" --arg ext "$ext" --arg file "$file" --arg title "$title" \
              '([.query.pages[]?.imageinfo[0]][0] // {}) as $i | {id:$id, image:($id+"."+$ext), article:$title, file:$file,
                page:($i.descriptionurl // ""), artist:(($i.extmetadata.Artist.value // "") | gsub("<[^>]*>";"") | gsub("^\\s+|\\s+$";"")),
                license:($i.extmetadata.LicenseShortName.value // "")}')
            if [ $first = 1 ]; then first=0; else echo "," >> $OUT/credits.json; fi
            echo "$entry" >> $OUT/credits.json
            sleep 1
          done <<'LIST'
          alto|Maruti Suzuki Alto K10;Maruti Suzuki Alto
          swift|Suzuki Swift
          baleno|Suzuki Baleno (2015);Maruti Suzuki Baleno
          dzire|Suzuki Dzire;Maruti Suzuki Dzire
          city|Honda City
          creta|Hyundai Creta
          scorpio|Mahindra Scorpio N;Mahindra Scorpio-N;Mahindra Scorpio
          ertiga|Suzuki Ertiga
          innova|Toyota Innova Crysta;Toyota Innova
          LIST
          echo "]" >> $OUT/credits.json
          ls -la $OUT; cat $OUT/credits.json
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/assets/cars
          git commit -m "Add Wikimedia Commons car photos for BS Car Rental demo" || exit 0
          git push
